name: PF-004 source bootstrap

on:
  push:
    branches: [pf-004-levelmesh-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify inherited PF baseline
      run: python3 tools/pf_oracle/run.py --baseline tools/pf_oracle/baseline.json --output /tmp/pf004-preflight.json
    - name: Compile standalone PF-004 contract
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Isrc/common/rendering/hwrenderer/data \
          tools/pf_oracle/tests/levelmesh_contract_fixture.cpp \
          -o /tmp/levelmesh-contract-fixture
        /tmp/levelmesh-contract-fixture
    - name: Apply bounded PF-004 source edits
      run: python3 tools/pf_oracle/pf004_apply_source.py
    - name: Sanity check patched tree
      run: |
        git diff --check
        grep -q 'MeshBufferChunkEndExclusive(range, IndexesPerBLAS)' src/common/rendering/hwrenderer/data/hw_collision.cpp
        grep -q 'MeshBufferChunkEndExclusive(range, IndexesPerBLAS)' src/common/rendering/vulkan/vk_levelmesh.cpp
        ! grep -A10 'OnSectorChangedTexZ' src/rendering/hwrenderer/doom_levelmesh.cpp | grep -q 'else if (line->sidedef\[1\])'
    - name: Commit bounded patch and remove bootstrap
      run: |
        git config user.name 'ShadeDoomVK PF automation'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git rm .github/workflows/pf004-bootstrap.yml tools/pf_oracle/pf004_apply_source.py
        git add -A
        git commit -m 'PF-004: harden LevelMesh mutation and allocation paths'
        git push origin HEAD:pf-004-levelmesh-hardening
