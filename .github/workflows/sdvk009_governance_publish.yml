name: SDVK-009 documentation source publication
on:
  push:
    branches: [sdvk009-authority-source-publication]
permissions:
  contents: write
concurrency:
  group: sdvk009-authority-source-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Publish only the independently reviewed documentation tree
      shell: bash
      run: |
        set -euo pipefail
        base=6aadd8458773014e4333cf93cf4b4269ce5733b3
        target=sdvk009-software-dependency-authority
        test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$base"
        git switch -c "$target" "$base"
        python3 - <<'PY'
        import base64, hashlib, json, lzma, os, subprocess
        from pathlib import Path
        payload = ""
        raw = lzma.decompress(base64.b64decode(payload, validate=True))
        assert hashlib.sha256(raw).hexdigest() == 'ecc189b01ed395e25b2fdb53202802760ecd89af7adc6eee864132a2922b01ec'
        packet = json.loads(raw)
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == packet['base']
        assert len(packet['files']) == 11
        for entry in packet['files']:
            p = Path(entry['path'])
            assert not p.is_absolute() and '..' not in p.parts
            assert str(p).startswith('docs/shadedoomvk/')
            assert p.suffix == '.md' or str(p) == 'docs/shadedoomvk/evidence/SDVK-009-DEPENDENCY-DISPOSITION.json'
            old = p.read_bytes() if p.exists() else b''
            assert hashlib.sha256(old).hexdigest() == entry['old_sha256'], str(p)
            lines = old.decode().splitlines(True)
            for op in reversed(entry['ops']):
                lines[op['start']:op['stop']] = op['text'].splitlines(True)
            new = ''.join(lines).encode()
            assert hashlib.sha256(new).hexdigest() == entry['new_sha256'], str(p)
            p.parent.mkdir(parents=True,exist_ok=True)
            p.write_bytes(new)
        subprocess.run(['git','add','--','docs/shadedoomvk'],check=True)
        subprocess.run(['git','diff','--cached','--check'],check=True)
        actual = subprocess.check_output(['git','write-tree'],text=True).strip()
        assert actual == packet['tree'] == 'f337a3de6091e396333a9816c653a7afcd84f3f5'
        changed = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
        assert set(changed) == {e['path'] for e in packet['files']}
        receipt = {'schema':'sdvk009-governance-source-publication/v1','status':'PASS','base':packet['base'],'tree':actual,'files':changed,'renderer_execution':False}
        Path(os.environ['RUNNER_TEMP'],'sdvk009-governance-publication.json').write_text(json.dumps(receipt,indent=2)+'\n')
        PY
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'SDVK-009: separate downstream software dependency from physical acceptance'
        git push origin "HEAD:refs/heads/$target"
        git rev-parse HEAD
    - uses: actions/upload-artifact@v4
      with:
        name: sdvk009-governance-publication
        path: ${{ runner.temp }}/sdvk009-governance-publication.json
        if-no-files-found: error
        retention-days: 30
