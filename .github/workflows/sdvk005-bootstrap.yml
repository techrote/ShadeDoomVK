name: SDVK-005 implementation bootstrap

on:
  push:
    branches:
      - sdvk-005-height-semantic
    paths:
      - .github/workflows/sdvk005-bootstrap.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/sdvk005-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdvk-005-height-semantic
          fetch-depth: 0
      - name: Apply exact SDVK-005 patch and publish implementation
        shell: bash
        run: |
          set -euo pipefail
          cat             .sdvk005/part00             .sdvk005/part01             .sdvk005/part02a1x             .sdvk005/part02a1y1a             .sdvk005/part02a1y1b2             .sdvk005/part02a1y2             .sdvk005/part02a2_0             .sdvk005/part02a2_1b             .sdvk005/part02a2_2             .sdvk005/part02a2_3             .sdvk005/part02b             .sdvk005/part03             | base64 -d | gzip -dc > /tmp/sdvk005.patch
          git apply --check /tmp/sdvk005.patch
          git apply /tmp/sdvk005.patch
          rm -rf .sdvk005
          rm -f .github/workflows/sdvk005-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SDVK-005: add optional height material semantic"
          git push origin HEAD:sdvk-005-height-semantic
