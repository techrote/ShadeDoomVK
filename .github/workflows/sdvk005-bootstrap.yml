name: SDVK-005 implementation bootstrap

on:
  push:
    branches:
      - sdvk-005-height-semantic
    paths:
      - .github/workflows/sdvk005-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact SDVK-005 patch and publish implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sdvk005/bootstrap.patch.gz.b64 | gzip -dc > /tmp/sdvk005.patch
          git apply --check /tmp/sdvk005.patch
          git apply /tmp/sdvk005.patch
          rm -rf .sdvk005
          rm -f .github/workflows/sdvk005-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SDVK-005: add optional height material semantic"
          git push origin HEAD:sdvk-005-height-semantic
