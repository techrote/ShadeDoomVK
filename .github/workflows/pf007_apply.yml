name: PF-007 source migration

on:
  push:
    branches: [pf-007-capability-registry]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: pf-007-capability-registry

    - name: Apply exact source transforms
      run: python3 tools/pf007_transform.py

    - name: Verify focused PF-007 contract before committing
      run: |
        python3 -m unittest tools.pf_oracle.tests.test_vulkan_capabilities_contract -v
        git diff --check

    - name: Commit migrated sources and remove staging helper
      run: |
        rm tools/pf007_transform.py .github/workflows/pf007_apply.yml
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "PF-007 centralize Vulkan capability decisions"
        git push origin HEAD:pf-007-capability-registry
