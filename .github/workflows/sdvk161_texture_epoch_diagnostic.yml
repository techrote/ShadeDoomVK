name: SDVK-161 startup texture epoch investigation (NONQUALIFYING)

on:
  push:
    branches:
      - diagnostic/sdvk161-texture-epoch-20261114

permissions:
  contents: read

jobs:
  startup-texture-epoch:
    name: Hosted llvmpipe | original 32+96 lifecycle + startup epoch trace (NOT QUALIFICATION)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Source-mode and adversarial CPU test preflight
      shell: bash
      run: |
        set -euo pipefail
        python3 -m py_compile tools/renderer_oracle/sdvk161_texture_epoch_diagnostic.py
        python3 -m unittest tools.renderer_oracle.tests.test_sdvk161_texture_epoch_diagnostic -v
        git diff --exit-code
        git rev-parse HEAD

    - name: Install original software Vulkan build and runtime prerequisites
      shell: bash
      run: |
        set -euo pipefail
        sudo apt update
        sudo apt install -y libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth freedoom xz-utils
        python3 tools/fetch_build_deps.py --platform linux --output build/deps

    - name: Build exact identified diagnostic source, once
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON -DNO_GTK=ON
        export MAKEFLAGS=--keep-going
        cmake --build build --config RelWithDebInfo --parallel 3

    - name: Authenticate clean native source and hosted CPU Vulkan
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        python3 tools/check_build_identity.py --build-dir build --config RelWithDebInfo --expected-state clean
        mapfile -t lvp < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#lvp[@]}" -eq 1
        echo "VK_DRIVER_FILES=${lvp[0]}" >> "$GITHUB_ENV"
        echo "VK_ICD_FILENAMES=${lvp[0]}" >> "$GITHUB_ENV"
        echo "SDL_VIDEODRIVER=x11" >> "$GITHUB_ENV"

    - name: Eight independent original SDVK-161 attempts and bounded startup caller trace
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
        SDVK161_TEXTURE_EPOCH_TRACE: '1'
      run: |
        set -euo pipefail
        PYTHONPATH="$PWD" xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk161_texture_epoch_diagnostic

    - name: Preserve even incomplete or falsified native packet and sidecar evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdvk161-startup-epoch-${{ github.sha }}
        path: build/sdvk161-texture-epoch-investigation/
        compression-level: 1
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: warn

    - name: Deliberate stop — diagnostic evidence cannot satisfy publication gates
      if: always()
      run: |
        echo "PRECHECK_ONLY: no acceptance, merge, renderer fix or revised tolerance is claimed."
        exit 1
