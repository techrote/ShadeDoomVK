name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pf_oracle:
    name: PF renderer contract oracle
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Run CPU contracts and deterministic oracle
      run: python3 tools/check.py --output build/pf-oracle

    - name: Upload check logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-contract-checks
        path: |
          build/pf-oracle/*.log
          build/pf-oracle/renderer-corpus/result.json
          build/pf-oracle/renderer-corpus/prepare-*/prepared.json

  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    needs: pf_oracle
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: RelWithDebInfo

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: macOS
          os: macos-14
          deps_cmdline: brew install libvpx
          build_type: Release

        - name: macOS
          os: macos-14
          extra_options: -G Xcode -DDYN_OPENAL=OFF
          deps_cmdline: brew install libvpx
          build_type: Debug

        - name: Linux GCC 12
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: RelWithDebInfo

        - name: Linux Clang 11
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt update && sudo apt install clang-11 libsdl2-dev libvpx-dev libopenal-dev libwebp-dev
          build_type: Debug

        - name: Linux Clang 15
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt update && sudo apt install clang-15 libsdl2-dev libvpx-dev libwebp-dev
          build_type: Release

        - name: Linux software Vulkan
          # Required CI critical path: use Avrea directly; do not duplicate this job on GitHub runners.
          os: avrea-ubuntu-24.04-16-vcpu
          extra_options: -DNO_GTK=ON
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth freedoom xz-utils
          build_type: RelWithDebInfo
          native_renderer: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        if [[ "${{ runner.os }}" == 'macOS' ]]; then
          python3 tools/fetch_build_deps.py --platform macos --output build/deps
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          python3 tools/fetch_build_deps.py --platform linux --output build/deps
        fi

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON ${{ matrix.config.extra_options }}

    - name: Build
      shell: bash
      run: |
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

    - name: Verify executable project and commit identity
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: python3 tools/check_build_identity.py --build-dir build --config ${{ matrix.config.build_type }} --expected-state clean

    - name: Qualify software Vulkan corpus and timing collection
      if: matrix.config.native_renderer
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        mapfile -t sdvk_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_icds[@]}" -eq 1
        export VK_DRIVER_FILES="${sdvk_icds[0]}"
        export VK_ICD_FILENAMES="${sdvk_icds[0]}"
        export SDL_VIDEODRIVER=x11
        mkdir -p build/renderer-sdvk008-preflight
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' vulkaninfo --summary > build/renderer-sdvk008-preflight/vulkaninfo-summary.txt 2> build/renderer-sdvk008-preflight/vulkaninfo-summary.stderr.txt
        sdvk_control_device=$(python3 -c 'from pathlib import Path; from tools.renderer_oracle.native_ci import fields; print(fields(Path("build/renderer-sdvk008-preflight/vulkaninfo-summary.txt").read_text(), "deviceName")[0])')
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/renderer_oracle/sdvk008_physical.py --exe build/vkdoom --iwad /usr/share/games/doom/freedoom2.wad --out build/renderer-sdvk008-control --device-name "$sdvk_control_device" --vulkan-summary build/renderer-sdvk008-preflight/vulkaninfo-summary.txt --expected-commit "$(git rev-parse HEAD)" --iwad-license /usr/share/doc/freedoom/copyright --execute --correctness-only --software-fixture-control
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/renderer_oracle/native_ci.py --exe build/vkdoom --iwad /usr/share/games/doom/freedoom2.wad --out build/renderer-native --full
        python3 tools/collision_replay.py --snapshot-root build/renderer-native/state/shadow-boundary --output build/renderer-native/collision-review.json --classification reconstructed-hosted-production --replay

    - name: Qualify SDVK-009 matching-content publication on hosted software Vulkan
      if: matrix.config.native_renderer
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        mapfile -t sdvk_publication_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_publication_icds[@]}" -eq 1
        export VK_DRIVER_FILES="${sdvk_publication_icds[0]}"
        export VK_ICD_FILENAMES="${sdvk_publication_icds[0]}"
        export SDL_VIDEODRIVER=x11
        python3 tools/renderer_oracle/sdvk009_publication.py fetch-content --out build/renderer-sdvk009-content
        export SDVK_REQUESTED_RUNNER=avrea-ubuntu-24.04-16-vcpu
        cat > build/sdvk009-avrea-ci.py <<'PY'
        import os
        from pathlib import Path
        import re
        import sys

        from tools.renderer_oracle import sdvk009_publication as publication
        from tools.renderer_oracle.common import pin, read_json, require

        def avrea32_software_guard():
            require(sys.platform == "linux" and os.environ.get("GITHUB_ACTIONS") == "true",
                    "Native publication qualification requires a Linux GitHub Actions runner")
            require(os.environ.get("RUNNER_ENVIRONMENT") == "self-hosted"
                    and os.environ.get("SDVK_REQUESTED_RUNNER") == "avrea-ubuntu-24.04-16-vcpu",
                    "Native publication qualification requires the preregistered Avrea 32-vCPU runner")
            require(hasattr(os, "sched_getaffinity") and len(os.sched_getaffinity(0)) == 16,
                    "Avrea publication qualification requires exactly 16 allowed CPUs")
            names = ("VK_DRIVER_FILES", "VK_ICD_FILENAMES")
            selected = []
            for name in names:
                value = os.environ.get(name, "")
                require(value and len(value.split(os.pathsep)) == 1,
                        "Select one lavapipe ICD explicitly with " + name)
                path = Path(value)
                require(path.is_absolute(), "Software ICD selection must use an absolute manifest path")
                selected.append(path.resolve(strict=True))
            require(selected[0] == selected[1], "Vulkan driver manifest selectors differ")
            path = selected[0]
            require(re.fullmatch(r"lvp_icd(?:\.[A-Za-z0-9_-]+)?\.json", path.name) is not None,
                    "Selected manifest is not the lavapipe ICD")
            manifest = read_json(path, maximum=65536)
            require(isinstance(manifest, dict) and isinstance(manifest.get("ICD"), dict),
                    "Malformed software ICD manifest")
            library = manifest["ICD"].get("library_path", "")
            require(isinstance(library, str)
                    and re.fullmatch(r"libvulkan_lvp\.so(?:\.[0-9]+)*", Path(library).name),
                    "Selected ICD does not name the lavapipe shared library")
            overrides = {key: value for key, value in os.environ.items() if value and
                         ((key.startswith("VK_") and key not in names) or key in
                          ("MESA_LOADER_DRIVER_OVERRIDE", "MESA_VK_DEVICE_SELECT",
                           "MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE", "DRI_PRIME"))}
            require(not overrides, "Additional Vulkan driver/layer/device overrides are not isolated")
            return {"platform": sys.platform, "provider": "avrea",
                    "requested_runner": os.environ["SDVK_REQUESTED_RUNNER"],
                    "allowed_processors": len(os.sched_getaffinity(0)),
                    "logical_processors": os.cpu_count(),
                    "runner_name": os.environ.get("RUNNER_NAME"),
                    "runner_environment": os.environ.get("RUNNER_ENVIRONMENT"),
                    "icd": pin(path), "library_path": library,
                    "selectors": {key: os.environ[key] for key in names},
                    "additional_overrides": {}}

        publication.hosted_software_guard = avrea32_software_guard
        raise SystemExit(publication.main([
            "qualify",
            "--exe", "build/vkdoom",
            "--iwad", "build/renderer-sdvk009-content/freedoom2.wad",
            "--iwad-license", "build/renderer-sdvk009-content/COPYING.txt",
            "--out", "build/renderer-sdvk009-publication",
            "--expected-commit", os.environ["GITHUB_SHA"],
        ]))
        PY
        PYTHONPATH="$PWD" xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 build/sdvk009-avrea-ci.py

    - name: Package complete software Vulkan evidence losslessly
      if: always() && matrix.config.native_renderer
      shell: bash
      run: |
        sdvk_evidence_dirs=()
        for sdvk_evidence_dir in renderer-native renderer-sdvk008-control renderer-sdvk008-preflight renderer-sdvk009-content renderer-sdvk009-publication; do
          if [[ -d "build/$sdvk_evidence_dir" ]]; then
            sdvk_evidence_dirs+=("$sdvk_evidence_dir")
          fi
        done
        if [[ "${#sdvk_evidence_dirs[@]}" -gt 0 ]]; then
          XZ_OPT='-6 --lzma2=dict=64MiB' tar -cJf build/renderer-software-vulkan.tar.xz -C build "${sdvk_evidence_dirs[@]}"
        fi

    - name: Upload complete software Vulkan evidence
      if: always() && matrix.config.native_renderer
      uses: actions/upload-artifact@v4
      with:
        name: renderer-software-vulkan
        path: build/renderer-software-vulkan.tar.xz
        compression-level: 0
        retention-days: 30

    - name: Diagnose macOS startup failure
      if: failure() && runner.os == 'macOS'
      shell: bash
      env:
        DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        runtime="build/vkdoom.app/Contents/MacOS/vkdoom"
        if [[ -f "build/${{ matrix.config.build_type }}/vkdoom.app/Contents/MacOS/vkdoom" ]]; then
          runtime="build/${{ matrix.config.build_type }}/vkdoom.app/Contents/MacOS/vkdoom"
        fi
        lldb --batch -o 'breakpoint set -n __cxa_throw' -o run -o 'thread backtrace all' -- "$runtime" --version

