name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Diagnostic source revisions never award qualification: the legacy required
  # check fails with PRECHECK_ONLY. Full mode retains every original workload.
  SDVK_PUBLICATION_CAMPAIGN: cohort-probe

jobs:
  pf_oracle:
    name: PF renderer contract oracle
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Validate CI evidence transport and timing reporting
      run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

    - name: Run CPU contracts and deterministic oracle
      run: python3 tools/check.py --output build/pf-oracle

    - name: Upload check logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpu-contract-checks
        path: |
          build/pf-oracle/*.log
          build/pf-oracle/renderer-corpus/result.json
          build/pf-oracle/renderer-corpus/prepare-*/prepared.json

  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: RelWithDebInfo

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: Linux GCC 12
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: RelWithDebInfo

        - name: Linux Clang 11
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt update && sudo apt install clang-11 libsdl2-dev libvpx-dev libopenal-dev libwebp-dev
          build_type: Debug

        - name: Linux Clang 15
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt update && sudo apt install clang-15 libsdl2-dev libvpx-dev libwebp-dev
          build_type: Release

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Select Python for Windows CPU containment controls
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build instance worker and qualify fake backend without Vulkan
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      shell: pwsh
      run: |
        cmake -S tools/physical_supervisor/probe -B build/instance-probe -G "Visual Studio 17 2022" -A x64
        if ($LASTEXITCODE -ne 0) { throw 'Instance-probe configuration failed' }
        cmake --build build/instance-probe --config RelWithDebInfo --parallel 2
        if ($LASTEXITCODE -ne 0) { throw 'Instance-probe build failed' }
        & ./build/instance-probe/RelWithDebInfo/sdvk009_probe_cpu_tests.exe
        if ($LASTEXITCODE -ne 0) { throw 'Fake-backend CPU controls failed' }
        $probeCpuControl = (Resolve-Path ./build/instance-probe/RelWithDebInfo/sdvk009_instance_probe.exe).Path
        "SDVK_CPU_PROBE_CONTROL_EXE=$probeCpuControl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Qualify Windows native supervisor with benign CPU children only
      if: runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      env:
        SDVK_CPU_FAILURE_EVIDENCE_ROOT: ${{ runner.temp }}/sdvk-supervisor-cpu-failures
      run: python -B -m unittest discover -s tools/physical_supervisor -t . -v

    - name: Retain unexpected native CPU fixture failures
      if: failure() && runner.os == 'Windows' && matrix.config.build_type == 'RelWithDebInfo'
      uses: actions/upload-artifact@v4
      with:
        name: supervisor-cpu-failures
        path: ${{ runner.temp }}/sdvk-supervisor-cpu-failures
        if-no-files-found: ignore
        include-hidden-files: true

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        if [[ "${{ runner.os }}" == 'Linux' ]]; then
          python3 tools/fetch_build_deps.py --platform linux --output build/deps
        fi

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON ${{ matrix.config.extra_options }}

    - name: Build
      shell: bash
      run: |
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

    - name: Verify executable project and commit identity
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: python3 tools/check_build_identity.py --build-dir build --config ${{ matrix.config.build_type }} --expected-state clean

#   - name: Create Package
