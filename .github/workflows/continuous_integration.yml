name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pf_oracle:
    name: PF renderer contract oracle
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Test oracle implementation
      run: python3 -m unittest discover -s tools/pf_oracle/tests -v

    - name: Verify deterministic PF baseline
      run: |
        mkdir -p build/pf-oracle
        python3 tools/pf_oracle/run.py \
          --baseline tools/pf_oracle/baseline.json \
          --output build/pf-oracle/oracle-a.json
        python3 tools/pf_oracle/run.py \
          --baseline tools/pf_oracle/baseline.json \
          --output build/pf-oracle/oracle-b.json
        cmp build/pf-oracle/oracle-a.json build/pf-oracle/oracle-b.json

    - name: Test renderer resource generation primitive
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Isrc/common/rendering/hwrenderer/data \
          tools/pf_oracle/tests/resource_generation_fixture.cpp \
          -o build/pf-oracle/resource-generation-fixture
        build/pf-oracle/resource-generation-fixture

    - name: Test bindless capacity and allocator model
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Isrc/common/rendering \
          -Isrc/common/rendering/vulkan/descriptorsets \
          tools/pf_oracle/tests/bindless_allocator_fixture.cpp \
          -o build/pf-oracle/bindless-allocator-fixture
        build/pf-oracle/bindless-allocator-fixture

    - name: Test LevelMesh mutation and allocator contract
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Isrc/common/rendering/hwrenderer/data \
          tools/pf_oracle/tests/levelmesh_contract_fixture.cpp \
          -o build/pf-oracle/levelmesh-contract-fixture
        build/pf-oracle/levelmesh-contract-fixture

    - name: Test async texture lifetime and staging arena contract
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Isrc/common/rendering \
          tools/pf_oracle/tests/texture_upload_contract_fixture.cpp \
          -o build/pf-oracle/texture-upload-contract-fixture
        build/pf-oracle/texture-upload-contract-fixture

  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    needs: pf_oracle
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: RelWithDebInfo

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: macOS
          os: macos-14
          deps_cmdline: brew install libvpx
          build_type: Release

        - name: macOS
          os: macos-14
          extra_options: -G Xcode -DDYN_OPENAL=OFF
          deps_cmdline: brew install libvpx
          build_type: Debug

        - name: Linux GCC 12
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt update && sudo apt install libsdl2-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: RelWithDebInfo

        - name: Linux Clang 11
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt update && sudo apt install clang-11 libsdl2-dev libvpx-dev libopenal-dev libwebp-dev
          build_type: Debug

        - name: Linux Clang 15
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt update && sudo apt install clang-15 libsdl2-dev libvpx-dev libwebp-dev
          build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        mkdir build
        if [[ "${{ runner.os }}" == 'macOS' ]]; then
          export ZMUSIC_PACKAGE=zmusic-1.1.14-macos-arm.tar.xz
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          export ZMUSIC_PACKAGE=zmusic-1.1.14-linux.tar.xz
        fi
        if [[ -n "${ZMUSIC_PACKAGE}" ]]; then
          cd build
          wget -q "https://github.com/coelckers/gzdoom/releases/download/ci_deps/${ZMUSIC_PACKAGE}"
          tar -xf "${ZMUSIC_PACKAGE}"
        fi

    - name: Configure
      shell: bash
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_PREFIX_PATH=`pwd`/build/zmusic -DPK3_QUIET_ZIPDIR=ON ${{ matrix.config.extra_options }} .

    - name: Build
      shell: bash
      run: |
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

