  # One exact source/runtime feeds the corpus, six short publication modules
  # plus compositing control, and three shadow workers. No consumer recompiles.
  vulkan_build:
    name: Linux software Vulkan | Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source: ${{ steps.publication_plan.outputs.source }}
      campaign: ${{ steps.publication_plan.outputs.campaign }}
      suites: ${{ steps.publication_plan.outputs.suites }}
      runtime_sha256: ${{ steps.publication_plan.outputs.runtime_sha256 }}
      inputs_sha256: ${{ steps.publication_plan.outputs.inputs_sha256 }}
      plan_sha256: ${{ steps.publication_plan.outputs.plan_sha256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Install software Vulkan build dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth freedoom xz-utils
        python3 tools/fetch_build_deps.py --platform linux --output build/deps

    - name: Configure and build
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON -DNO_GTK=ON
        export MAKEFLAGS=--keep-going
        cmake --build build --config RelWithDebInfo --parallel 3

    - name: Verify source-matched binaries
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: python3 tools/check_build_identity.py --build-dir build --config RelWithDebInfo --expected-state clean

    - name: Package exact build once for all qualification workers
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        test -f build/vkdoom.pk3
        files=(build/vkdoom build/vktool build/CMakeCache.txt build/deps/zmusic/lib build/*.pk3)
        for directory in build/fm_banks build/soundfonts; do
          [[ ! -d "$directory" ]] || files+=("$directory")
        done
        tar -cf build/software-vulkan-runtime.tar "${files[@]}"
        gzip -1 build/software-vulkan-runtime.tar
        (cd build && sha256sum software-vulkan-runtime.tar.gz > software-vulkan-runtime.tar.gz.sha256)

    - name: Authenticate historical content and preregister the complete capture plan
      id: publication_plan
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        source=$(git rev-parse HEAD)
        flags=()
        case "$SDVK_PUBLICATION_CAMPAIGN" in
          full)
            suites='["corpus","publication","controls","witness-1","witness-2"]'
            flags+=(--cohort)
            ;;
          cohort-probe)
            suites='["publication","controls","witness-1","witness-2"]'
            flags+=(--cohort-probe)
            ;;
          preflight)
            suites='["controls","witness-1","witness-2"]'
            flags+=(--compatibility-probe)
            ;;
          shadow-startup-probe)
            suites='["controls","witness-1","witness-2"]'
            flags+=(--shadow-startup-probe)
            ;;
          *) echo 'Unknown publication campaign mode' >&2; exit 1 ;;
        esac
        python3 tools/renderer_oracle/sdvk009_publication.py fetch-content --out build/renderer-sdvk009-content
        python3 -m tools.renderer_oracle.sdvk009_distributed register \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --runtime-archive build/software-vulkan-runtime.tar.gz \
          --expected-commit "$source" \
          --out build/renderer-sdvk009-plan "${flags[@]}"
        tar -czf build/software-vulkan-publication-inputs.tar.gz -C build renderer-sdvk009-content renderer-sdvk009-plan
        (cd build && sha256sum software-vulkan-publication-inputs.tar.gz > software-vulkan-publication-inputs.tar.gz.sha256)
        {
          printf 'source=%s\n' "$source"
          printf 'campaign=%s\n' "$SDVK_PUBLICATION_CAMPAIGN"
          printf 'suites=%s\n' "$suites"
          printf 'runtime_sha256=%s\n' "$(sha256sum build/software-vulkan-runtime.tar.gz | cut -d ' ' -f1)"
          printf 'inputs_sha256=%s\n' "$(sha256sum build/software-vulkan-publication-inputs.tar.gz | cut -d ' ' -f1)"
          printf 'plan_sha256=%s\n' "$(sha256sum build/renderer-sdvk009-plan/preregistration.json | cut -d ' ' -f1)"
        } >> "$GITHUB_OUTPUT"

    - name: Upload source-matched renderer
      uses: actions/upload-artifact@v4
      with:
        name: software-vulkan-runtime
        path: |
          build/software-vulkan-runtime.tar.gz
          build/software-vulkan-runtime.tar.gz.sha256
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

    - name: Upload immutable publication inputs once
      uses: actions/upload-artifact@v4
      with:
        name: software-vulkan-publication-inputs
        path: |
          build/software-vulkan-publication-inputs.tar.gz
          build/software-vulkan-publication-inputs.tar.gz.sha256
        compression-level: 0
        retention-days: 30
        if-no-files-found: error


  vulkan_qualification:
    name: Linux software Vulkan | ${{ matrix.suite }}
    needs: vulkan_build
    runs-on: ubuntu-24.04
    # A one-host compatible cohort may execute three original 3600-second
    # captures serially. This bound includes setup, rendezvous and retention.
    timeout-minutes: 230
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Registration emits only fixed 3/4-worker diagnostic sets or the five
        # full workers. Cohort allocation changes capture owners, never jobs.
        suite: ${{ fromJSON(needs.vulkan_build.outputs.suites) }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Install original hosted software Vulkan test environment
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth freedoom xz-utils

    - name: Download exactly one shared renderer build
      uses: actions/download-artifact@v4
      with:
        name: software-vulkan-runtime
        path: build

    - name: Download preregistered publication inputs
      uses: actions/download-artifact@v4
      with:
        name: software-vulkan-publication-inputs
        path: build

    - name: Verify archive and source-matched runtime
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = '${{ needs.vulkan_build.outputs.source }}'
        echo '${{ needs.vulkan_build.outputs.runtime_sha256 }}  build/software-vulkan-runtime.tar.gz' | sha256sum -c -
        (cd build && sha256sum -c software-vulkan-runtime.tar.gz.sha256)
        tar -tzf build/software-vulkan-runtime.tar.gz >/dev/null
        tar -xzf build/software-vulkan-runtime.tar.gz
        test -x build/vkdoom && test -x build/vktool
        python3 tools/check_build_identity.py --build-dir build --config RelWithDebInfo --expected-state clean
        echo '${{ needs.vulkan_build.outputs.inputs_sha256 }}  build/software-vulkan-publication-inputs.tar.gz' | sha256sum -c -
        (cd build && sha256sum -c software-vulkan-publication-inputs.tar.gz.sha256)
        tar -tzf build/software-vulkan-publication-inputs.tar.gz >/dev/null
        tar -xzf build/software-vulkan-publication-inputs.tar.gz -C build
        echo '${{ needs.vulkan_build.outputs.plan_sha256 }}  build/renderer-sdvk009-plan/preregistration.json' | sha256sum -c -

    - name: Record hosted worker environment and execution identity
      shell: bash
      env:
        SDVK_WORKER: ${{ matrix.suite }}
      run: |
        python3 - <<'PY'
        from datetime import datetime, timezone
        import json, os, pathlib, subprocess
        from tools.ci.renderer_ci_timings import machine_profile
        out = pathlib.Path('build') / ('renderer-ci-' + os.environ['SDVK_WORKER'])
        out.mkdir(parents=True, exist_ok=True)
        profile = machine_profile()
        profile.update(worker=os.environ['SDVK_WORKER'], started_utc=datetime.now(timezone.utc).isoformat(), source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
        (out / 'profile.json').write_text(json.dumps(profile, indent=2, sort_keys=True) + '\n')
        PY

    - name: Qualify software Vulkan corpus and timing collection
      if: matrix.suite == 'corpus'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        mapfile -t sdvk_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_icds[@]}" -eq 1
        export VK_DRIVER_FILES="${sdvk_icds[0]}"
        export VK_ICD_FILENAMES="${sdvk_icds[0]}"
        export SDL_VIDEODRIVER=x11
        mkdir -p build/renderer-sdvk008-preflight
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' vulkaninfo --summary > build/renderer-sdvk008-preflight/vulkaninfo-summary.txt 2> build/renderer-sdvk008-preflight/vulkaninfo-summary.stderr.txt
        sdvk_control_device=$(python3 -c 'from pathlib import Path; from tools.renderer_oracle.native_ci import fields; print(fields(Path("build/renderer-sdvk008-preflight/vulkaninfo-summary.txt").read_text(), "deviceName")[0])')
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/renderer_oracle/sdvk008_physical.py --exe build/vkdoom --iwad /usr/share/games/doom/freedoom2.wad --out build/renderer-sdvk008-control --device-name "$sdvk_control_device" --vulkan-summary build/renderer-sdvk008-preflight/vulkaninfo-summary.txt --expected-commit "$(git rev-parse HEAD)" --iwad-license /usr/share/doc/freedoom/copyright --execute --correctness-only --software-fixture-control
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/renderer_oracle/native_ci.py --exe build/vkdoom --iwad /usr/share/games/doom/freedoom2.wad --out build/renderer-native --full
        python3 tools/collision_replay.py --snapshot-root build/renderer-native/state/shadow-boundary --output build/renderer-native/collision-review.json --classification reconstructed-hosted-production --replay

    # The six short module sequences stay serial. The preregistered SDVK-009
    # sibling captures run independently and are accepted only after assembly.
    - name: Select explicit hosted llvmpipe for publication workers
      if: matrix.suite != 'corpus'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t sdvk_publication_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_publication_icds[@]}" -eq 1
        {
          printf 'VK_DRIVER_FILES=%s\n' "$sdvk_publication_icds"
          printf 'VK_ICD_FILENAMES=%s\n' "$sdvk_publication_icds"
          printf 'SDL_VIDEODRIVER=x11\n'
        } >> "$GITHUB_ENV"

    - name: Collect one preregistered bounded compatibility probe per shadow host
      if: (env.SDVK_PUBLICATION_CAMPAIGN == 'full' || env.SDVK_PUBLICATION_CAMPAIGN == 'cohort-probe') && (matrix.suite == 'controls' || matrix.suite == 'witness-1' || matrix.suite == 'witness-2')
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        PYTHONPATH="$PWD" xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk009_distributed probe \
          --plan build/renderer-sdvk009-plan/preregistration.json \
          --worker '${{ matrix.suite }}' \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --runtime-archive build/software-vulkan-runtime.tar.gz \
          --out 'build/renderer-sdvk009-probe-${{ matrix.suite }}' \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Retain immutable compatibility probe including failures
      if: always() && (env.SDVK_PUBLICATION_CAMPAIGN == 'full' || env.SDVK_PUBLICATION_CAMPAIGN == 'cohort-probe') && (matrix.suite == 'controls' || matrix.suite == 'witness-1' || matrix.suite == 'witness-2')
      uses: actions/upload-artifact@v4
      with:
        name: sdvk-cohort-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
        path: build/renderer-sdvk009-probe-${{ matrix.suite }}/
        include-hidden-files: true
        compression-level: 1
        retention-days: 30
        if-no-files-found: error

    - name: Qualify SDVK-010 actors on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk010_acceptance \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk010 \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Qualify SDVK-150 probe ownership on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk150_probe_owner \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk150 \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Qualify SDVK-153 sampler reset on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk153_probe_reset \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk153 \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Qualify SDVK-158 lightmap transition on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk158_lightmap_transition \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk158 \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Qualify SDVK-161 special surfaces on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        # SDVK-161: bounded special surfaces with current submitted owners and
        # exact checkpoint RGB across both maps and their same-map reloads.
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk161_special_surfaces \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk161 \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Qualify SDVK-014 controlled planes on hosted software Vulkan
      if: matrix.suite == 'publication'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        # SDVK-014: independent BOTH-plane source/facing correctness on the
        # same hosted software build. The accepted SDVK-161 recipe stays intact.
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk014_controlled_planes \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --out build/renderer-sdvk014-controlled \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Authenticate all three immutable peer probes within a bounded barrier
      id: cohort_barrier
      if: (env.SDVK_PUBLICATION_CAMPAIGN == 'full' || env.SDVK_PUBLICATION_CAMPAIGN == 'cohort-probe') && matrix.suite != 'corpus'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 tools/ci/renderer_cohort_artifacts.py \
          --repository '${{ github.repository }}' \
          --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
          --expected-commit "$(git rev-parse HEAD)" \
          --plan-sha256 '${{ needs.vulkan_build.outputs.plan_sha256 }}' \
          --out build/cohort-peers --artifact-set build/cohort-artifacts.json \
          --report 'build/renderer-ci-${{ matrix.suite }}/cohort-barrier.json'

    - name: Retain failed cohort transfers without repeating probes
      if: always() && (steps.cohort_barrier.outcome == 'failure' || steps.cohort_barrier.outcome == 'cancelled')
      uses: actions/upload-artifact@v4
      with:
        name: renderer-cohort-transfer-failure-${{ matrix.suite }}
        path: |
          build/cohort-peers-archives/
          build/renderer-ci-${{ matrix.suite }}/cohort-barrier.json
        include-hidden-files: true
        compression-level: 0
        retention-days: 30
        if-no-files-found: error

    - name: Execute exactly the preregistered SDVK-009 worker captures
      if: matrix.suite == 'publication' || matrix.suite == 'controls' || matrix.suite == 'witness-1' || matrix.suite == 'witness-2'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
      run: |
        set -euo pipefail
        flags=()
        if [[ "$SDVK_PUBLICATION_CAMPAIGN" == full || "$SDVK_PUBLICATION_CAMPAIGN" == cohort-probe ]]; then
          flags+=(--peers build/cohort-peers --artifact-set build/cohort-artifacts.json)
        fi
        PYTHONPATH="$PWD" xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 -m tools.renderer_oracle.sdvk009_distributed worker \
          --plan build/renderer-sdvk009-plan/preregistration.json \
          --worker '${{ matrix.suite }}' \
          --exe "$PWD/build/vkdoom" \
          --iwad build/renderer-sdvk009-content/freedoom2.wad \
          --iwad-license build/renderer-sdvk009-content/COPYING.txt \
          --runtime-archive build/software-vulkan-runtime.tar.gz \
          --out 'build/renderer-sdvk009-worker-${{ matrix.suite }}' \
          --expected-commit "$(git rev-parse HEAD)" "${flags[@]}"

    - name: Record worker completion including failures
      if: always()
      shell: bash
      env:
        SDVK_WORKER: ${{ matrix.suite }}
        SDVK_JOB_STATUS: ${{ job.status }}
      run: |
        python3 - <<'PY'
        from datetime import datetime, timezone
        import json, os, pathlib
        out = pathlib.Path('build') / ('renderer-ci-' + os.environ['SDVK_WORKER'])
        out.mkdir(parents=True, exist_ok=True)
        (out / 'completion.json').write_text(json.dumps({'worker': os.environ['SDVK_WORKER'], 'status': os.environ['SDVK_JOB_STATUS'], 'finished_utc': datetime.now(timezone.utc).isoformat()}, indent=2, sort_keys=True) + '\n')
        PY

    - name: Package lossless suite evidence (including failures)
      if: always()
      shell: bash
      run: |
        python3 tools/ci/renderer_evidence.py pack --build build --suite '${{ matrix.suite }}' \
          --expected-commit "$(git rev-parse HEAD)" \
          --runtime-sha256 '${{ needs.vulkan_build.outputs.runtime_sha256 }}' \
          --plan-sha256 '${{ needs.vulkan_build.outputs.plan_sha256 }}' \
          --job-status '${{ job.status }}'

    - name: Retain suite evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renderer-software-vulkan-${{ matrix.suite }}
        path: |
          build/renderer-${{ matrix.suite }}.tar
          build/renderer-${{ matrix.suite }}.tar.sha256
          build/renderer-${{ matrix.suite }}.manifest.json
        # Zip's inexpensive DEFLATE is temporary transport, not final storage.
        compression-level: 1
        retention-days: 30
        if-no-files-found: error


  vulkan_evidence:
    # Preserve the exact required check name and original .tar.xz consumer.
    name: Linux software Vulkan | RelWithDebInfo
    needs: [pf_oracle, build, vulkan_build, vulkan_qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Download available qualification evidence
      if: needs.vulkan_build.result == 'success'
      uses: actions/download-artifact@v4
      with:
        pattern: renderer-software-vulkan-*
        path: build/parts
        # Keep each artifact in its own directory so duplicate or unknown
        # deliveries cannot overwrite valid evidence before authentication.
        merge-multiple: false

    - name: Authenticate and restore worker evidence without accepting captures
      id: restore
      if: always() && needs.vulkan_build.result == 'success'
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        if [[ "${{ needs.vulkan_qualification.result }}" == success ]]; then
          flags+=(--complete)
        fi
        case "$SDVK_PUBLICATION_CAMPAIGN" in
          full) ;;
          cohort-probe) flags+=(--suites publication,controls,witness-1,witness-2) ;;
          preflight|shadow-startup-probe) flags+=(--suites controls,witness-1,witness-2) ;;
          *) echo 'Unknown publication campaign mode' >&2; exit 1 ;;
        esac
        python3 tools/ci/renderer_evidence.py merge \
          --parts build/parts --out build/evidence-merged \
          --expected-commit "$(git rev-parse HEAD)" \
          --runtime-sha256 '${{ needs.vulkan_build.outputs.runtime_sha256 }}' \
          --plan-sha256 '${{ needs.vulkan_build.outputs.plan_sha256 }}' "${flags[@]}"

    - name: Reconstruct and validate all original SDVK-009 comparisons and controls
      id: assemble
      if: always() && steps.restore.outcome == 'success' && needs.vulkan_qualification.result == 'success'
      shell: bash
      run: |
        python3 -m tools.renderer_oracle.sdvk009_distributed assemble \
          --plan build/evidence-merged/renderer-sdvk009-plan/preregistration.json \
          --workers build/evidence-merged \
          --out build/evidence-merged/renderer-sdvk009-publication \
          --expected-commit "$(git rev-parse HEAD)"

    - name: Report individual capture timings after evidence assembly
      if: always() && steps.restore.outcome == 'success' && env.SDVK_PUBLICATION_CAMPAIGN == 'full'
      shell: bash
      run: |
        python3 tools/ci/renderer_ci_timings.py build/evidence-merged/renderer-sdvk009-publication \
          --out build/evidence-merged/renderer-ci-timings/report.json \
          --summary "$GITHUB_STEP_SUMMARY"

    - name: Package and verify the complete legacy archive including failed comparisons
      id: finalize
      if: always() && steps.restore.outcome == 'success'
      shell: bash
      run: |
        python3 tools/ci/renderer_evidence.py finalize \
          --root build/evidence-merged --archive build/renderer-software-vulkan.tar.xz

    - name: Upload complete software Vulkan evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renderer-software-vulkan
        path: |
          build/renderer-software-vulkan.tar.xz
          build/renderer-software-vulkan.tar.xz.sha256
          build/renderer-evidence-manifest.json
          build/renderer-transport-manifest.json
          build/renderer-evidence-packaging.json
        compression-level: 0
        retention-days: 30
        if-no-files-found: ignore

    - name: Require every native, platform, CPU and authenticated assembly gate
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$SDVK_PUBLICATION_CAMPAIGN" != full ]]; then
          echo 'PRECHECK_ONLY: compatibility evidence cannot satisfy native qualification.' >&2
          exit 1
        fi
        test "${{ needs.pf_oracle.result }}" = success
        test "${{ needs.build.result }}" = success
        test "${{ needs.vulkan_build.result }}" = success
        test "${{ needs.vulkan_qualification.result }}" = success
        test "${{ steps.restore.outcome }}" = success
        test "${{ steps.assemble.outcome }}" = success
        test "${{ steps.finalize.outcome }}" = success
        python3 - <<'PY'
        import json
        from pathlib import Path
        qualification = json.loads(Path('build/evidence-merged/renderer-sdvk009-publication/qualification.json').read_text())
        assert qualification['status'] == 'PASS', 'Missing complete SDVK-009 qualification'
        PY

