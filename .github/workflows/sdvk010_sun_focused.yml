name: SDVK-010 sunlight/occlusion focused qualification

on:
  push:
    branches: [sdvk010-sun-occlusion-acceptance]

permissions:
  contents: read

concurrency:
  group: sdvk010-sun-occlusion-focused
  cancel-in-progress: false

jobs:
  sun_actor:
    name: Focused sun actor CPU and hosted software Vulkan
    runs-on: avrea-ubuntu-24.04-16-vcpu
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: CPU-only authoring, actual draw-source, oracle and negative controls
      shell: bash
      run: |
        set -euo pipefail
        python3 -m unittest tools.renderer_oracle.tests.test_sdvk010_sun_occlusion tools.renderer_oracle.tests.test_corpus tools.renderer_oracle.tests.test_actor_probe_validation -v
        python3 tools/renderer_oracle/prepare.py --scene sun-actor-occlusion --out build/sdvk010-sun-prepared

    - name: Install hosted software Vulkan and build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt update
        sudo apt install libsdl2-dev libvpx-dev libdbus-1-dev libbz2-dev libx11-dev libwebp-dev mesa-vulkan-drivers vulkan-tools xvfb xauth xz-utils
        python3 tools/fetch_build_deps.py --platform linux --output build/deps

    - name: Build software-only native acceptance executable
      shell: bash
      run: |
        set -euo pipefail
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="${PWD}/build/deps/zmusic" -DPK3_QUIET_ZIPDIR=ON -DNO_GTK=ON
        cmake --build build --config RelWithDebInfo --parallel 3
        LD_LIBRARY_PATH="${PWD}/build/deps/zmusic/lib" python3 tools/check_build_identity.py --build-dir build --config RelWithDebInfo --expected-state clean

    - name: Fetch identical authenticated historical open-content IWAD
      shell: bash
      run: python3 tools/renderer_oracle/sdvk009_publication.py fetch-content --out build/sdvk010-sun-content

    - name: Two independent software-only sunlight actor captures
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/build/deps/zmusic/lib
        SDVK_REQUESTED_RUNNER: avrea-ubuntu-24.04-16-vcpu
      run: |
        set -euo pipefail
        mapfile -t sdvk_icds < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json"))))')
        test "${#sdvk_icds[@]}" -eq 1
        export VK_DRIVER_FILES="${sdvk_icds[0]}"
        export VK_ICD_FILENAMES="${sdvk_icds[0]}"
        export SDL_VIDEODRIVER=x11
        test -z "${CFX_TRACE_FILE:-}${CFX_RUN_ID:-}${CFX_RESOURCE_TRACE:-}${CFX_WITNESS_DIR:-}"
        xvfb-run -a -s '-screen 0 640x480x24 -nolisten tcp' python3 tools/renderer_oracle/sdvk010_sun_native.py \
          --exe "${{ github.workspace }}/build/vkdoom" \
          --iwad build/sdvk010-sun-content/freedoom2.wad \
          --prepared build/sdvk010-sun-prepared \
          --out build/sdvk010-sun-native \
          --expected-commit "${{ github.sha }}"

    - name: Package focused native evidence, including failed first capture
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        dirs=()
        for path in sdvk010-sun-native sdvk010-sun-prepared; do
          if [[ -d "build/$path" ]]; then dirs+=("$path"); fi
        done
        if [[ "${#dirs[@]}" -gt 0 ]]; then
          XZ_OPT='-6 --lzma2=dict=64MiB' tar -cJf build/sdvk010-sun-focused.tar.xz -C build "${dirs[@]}"
        fi

    - name: Upload all focused test and native evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdvk010-sun-focused
        path: build/sdvk010-sun-focused.tar.xz
        compression-level: 0
        retention-days: 30
